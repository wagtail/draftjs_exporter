# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

# Evals for the `draftjs-exporter` agent skill
# (`.agents/skills/draftjs-exporter/SKILL.md`) and the published documentation.
#
# Every test runs against four arms — a 2x2 over "can it load the skill" and
# "can it read the docs" — so a run answers two questions at once: does the
# skill beat the model's own knowledge, and does it still add anything once the
# docs are readable?
#
#                 | no docs    | docs
#   --------------|------------|-------------
#   no skill      | baseline   | docs
#   skill         | skill      | docs+skill
#
# The docs arms read `.eval-docs/`, a fixture holding the published `llms.txt`
# and `llms-full.txt` (built by `just eval-docs`). Pointing them at `docs/` or
# `site/` instead would leak this file — and its expected answers — to the model.
#
# Most tests ask for a complete, runnable script and then actually run it
# against the installed library (`graders/run_snippet.py`). A hallucinated API
# fails there even when the prose around it reads well, which is exactly the
# failure mode a reference is supposed to prevent. Knowledge-only gotchas are
# graded by rubric because they have no code answer.
#
# Caveat worth keeping in mind when reading results: the skill arms differ from
# the baseline by one tool, which is a controlled comparison. The docs arms also
# add `read`/`grep`/`glob`/`list`, so a docs arm that loses may be losing on
# retrieval rather than on documentation quality.
#
# Requires:
#   - `just eval-init` — installs `promptfoo`, `@opencode-ai/sdk` and the
#     OpenCode CLI globally. They stay out of package.json so contributors who
#     never run evals don't pay for them; promptfoo resolves the SDK from the
#     same global tree it lives in.
#   - `just init` — the graders import `draftjs_exporter` from the project venv.
#   - `TENSORX_API_KEY` — both the model under test and the rubric grader run on
#     TensorX.
#
# Run:
#   just eval
#   just eval --repeat 3   # agent runs are noisy; repeat before trusting a delta
#   just eval-view         # dashboard for the latest run

prompts:
  - "{{prompt}}"

# The OpenCode SDK provider takes its model list from OpenCode's own config, not
# from promptfoo. `just eval` points `OPENCODE_CONFIG` at `opencode.json` next to
# this file, which defines the `tensorx` provider and its base URL. The `apiKey`
# below is what promptfoo's own "is this provider configured" check looks for.
#
# All four arms share `working_dir`, the system prompt and the model, and differ
# only in which tools they get. Three settings keep that honest:
#
#   - `tools: {"*": false}` strips every built-in tool _and_ any MCP server the
#     person running the eval happens to have configured globally, so results do
#     not depend on whose machine ran them. Each arm adds back only what it is
#     meant to have.
#   - `custom_agent` replaces OpenCode's coding-agent system prompt. Without it,
#     a toolless run spends its turns narrating "let me look at the files" and
#     never answers — that measures the harness, not the reference material. It
#     also pins temperature. The prompt is deliberately identical across arms and
#     true of all of them.
#   - `permission.skill` denies every skill, then re-allows the one under test,
#     so a globally-installed skill cannot answer for it. Order matters: a
#     trailing `"*": deny` shadows the specific allow above it and hides
#     everything.
#
# `working_dir` is the docs fixture rather than the repo root, so the docs arms
# cannot read `draftjs_exporter/` source and outscore the docs on their behalf.
# OpenCode still finds `.agents/skills/` by walking up to the git root, and
# loading it is not blocked by `external_directory: deny`.
providers:
  - id: opencode:sdk
    label: baseline
    config: &opencode
      provider_id: tensorx
      model: deepseek/deepseek-v4-flash-0731
      apiKey: "{{ env.TENSORX_API_KEY }}"
      working_dir: ../../.eval-docs
      tools:
        "*": false
      permission: &closed
        external_directory: deny
      custom_agent:
        description: draftjs_exporter question answering
        temperature: 0
        # High enough that a docs arm can search, read and still answer. At 8,
        # a sixth of all runs died mid-search on "maximum steps reached", which
        # penalised precisely the arms that have something to search.
        steps: 20
        prompt: >-
          You are answering a developer's question about the `draftjs_exporter`
          Python library. Answer directly and concisely, using what you know plus
          whatever tools and reference material you have — if you have neither,
          answer from memory rather than asking for file access. Reference
          documentation, when you can read it, is in your working directory. When
          the question asks for a script, reply with one complete, runnable
          Python code block.

  - id: opencode:sdk
    label: skill
    config:
      <<: *opencode
      tools:
        "*": false
        skill: true
      permission: &skills_allowed
        skill:
          "*": deny
          draftjs-exporter: allow
        external_directory: deny

  - id: opencode:sdk
    label: docs
    config:
      <<: *opencode
      tools: &docs_tools
        "*": false
        read: true
        grep: true
        glob: true
        list: true
      permission: *closed

  - id: opencode:sdk
    label: docs+skill
    config:
      <<: *opencode
      tools:
        <<: *docs_tools
        skill: true
      permission: *skills_allowed

# Agent runs are token-heavy, and a provider rate limit surfaces as empty output
# rather than an error — a mystery assertion failure. Keep concurrency low.
evaluateOptions:
  maxConcurrency: 2

defaultTest:
  options:
    # `expect_contains` is a list var read by the grader, not a matrix of test
    # cases. Without this, promptfoo would fan each one out into several tests.
    disableVarExpansion: true
    # Rubric grading runs on TensorX too, so the eval needs a single API key. A
    # different model family from the one under test, so it is not grading itself.
    provider:
      id: openai:chat:z-ai/glm-5.2
      config:
        apiBaseUrl: "https://api.tensorx.ai/v1"
        apiKey: "{{ env.TENSORX_API_KEY }}"
        temperature: 0
        max_tokens: 4096
        # Without this the grader occasionally answers in prose and promptfoo
        # fails the test with "Could not extract JSON". It still happens for a
        # small share of runs, so treat a lone rubric failure as noise until
        # `--repeat` reproduces it.
        response_format:
          type: json_object
  # An OpenCode provider error — a rate limit, a dropped connection — comes back
  # as empty output rather than an error, and would otherwise be graded as if the
  # model had answered badly. Name it so it cannot be mistaken for a result.
  assert:
    - type: javascript
      value: |
        return (output || '').trim().length > 0
          ? { pass: true, score: 1, reason: 'Provider returned output' }
          : { pass: false, score: 0, reason: 'EMPTY RESPONSE — provider error, not a model failure. Re-run this row.' };

tests:
  # --- Tasks graded by running the answer -----------------------------------

  - description: Wrap list items in a styled wrapper
    vars:
      prompt: >-
        Using the `draftjs_exporter` Python library, write a complete runnable
        script that renders this ContentState to HTML and prints it, with the
        unordered list items wrapped in `<ul class="bullet-list">`:
        {"entityMap": {}, "blocks": [{"key": "a", "text": "One", "type":
        "unordered-list-item", "depth": 0, "inlineStyleRanges": [],
        "entityRanges": []}, {"key": "b", "text": "Two", "type":
        "unordered-list-item", "depth": 0, "inlineStyleRanges": [],
        "entityRanges": []}]}
      expect_stdout: '<ul class="bullet-list"><li>One</li><li>Two</li></ul>'
    assert: &run_snippet
      - type: python
        value: file://graders/run_snippet.py

  - description: Configure Markdown output characters
    vars:
      prompt: >-
        Using the `draftjs_exporter` Python library, write a complete runnable
        script that renders this ContentState to Markdown and prints it, using
        `*` as the unordered list marker and `__` for bold:
        {"entityMap": {}, "blocks": [{"key": "a", "text": "One", "type":
        "unordered-list-item", "depth": 0, "inlineStyleRanges": [],
        "entityRanges": []}, {"key": "b", "text": "Bold", "type": "unstyled",
        "depth": 0, "inlineStyleRanges": [{"offset": 0, "length": 4, "style":
        "BOLD"}], "entityRanges": []}]}
      expect_contains:
        - "* One"
        - "__Bold__"
    assert: *run_snippet

  - description: Render a link entity with a custom component
    vars:
      prompt: >-
        Using the `draftjs_exporter` Python library, write a complete runnable
        script that renders this ContentState to HTML and prints it. LINK
        entities must render as an `<a>` with the entity's `url` as `href` and
        a `class="link"` attribute:
        {"entityMap": {"0": {"type": "LINK", "mutability": "MUTABLE", "data":
        {"url": "https://example.com"}}}, "blocks": [{"key": "a", "text":
        "Hello", "type": "unstyled", "depth": 0, "inlineStyleRanges": [],
        "entityRanges": [{"offset": 0, "length": 5, "key": 0}]}]}
      expect_contains:
        - "<a "
        - 'href="https://example.com"'
        - 'class="link"'
        - ">Hello</a>"
    assert: *run_snippet

  - description: Keep content for an unmapped block type
    vars:
      prompt: >-
        Using the `draftjs_exporter` Python library, write a complete runnable
        script that renders this ContentState to HTML and prints it. My editor
        emits custom block types I cannot enumerate ahead of time, so I can't
        add every one of them to the block map. Whenever the exporter meets a
        block type it has no mapping for, it should keep the block's text and
        drop the wrapping element rather than fail:
        {"entityMap": {}, "blocks": [{"key": "a", "text": "Odd", "type":
        "my-custom-block", "depth": 0, "inlineStyleRanges": [],
        "entityRanges": []}]}
      expect_stdout: "Odd"
    assert: *run_snippet

  - description: Resolve an internal URL scheme on Markdown import
    vars:
      prompt: >-
        Using the `draftjs_exporter` Python library, write a complete runnable
        script that parses the Markdown `See [our page](wagtail://page?id=42).`
        into Draft.js ContentState, turning `wagtail://page` URLs into `LINK`
        entities whose data holds the page id as an integer. Print
        `json.dumps(content_state["entityMap"], sort_keys=True)`.
      expect_stdout: '{"0": {"data": {"id": 42}, "mutability": "MUTABLE", "type": "LINK"}}'
    assert: *run_snippet

  # --- Designed for the docs comparison -------------------------------------
  #
  # These two need more than one part of the reference to answer. The migration
  # one is the sharper probe: the skill only links to the migration guide, so a
  # skill arm that passes it is answering from memory, and a docs arm that fails
  # it means the published docs are not carrying their weight.

  - description: Combine a composite decorator with a style fallback
    vars:
      prompt: >-
        Using the `draftjs_exporter` Python library, write a complete runnable
        script that renders this ContentState to HTML and prints it. Newlines
        inside block text must render as `<br>` elements, and inline styles that
        are not in the default style map must render their text with no
        surrounding element instead of failing:
        {"entityMap": {}, "blocks": [{"key": "a", "text": "Line one\nLine two",
        "type": "unstyled", "depth": 0, "inlineStyleRanges": [],
        "entityRanges": []}, {"key": "b", "text": "Odd", "type": "unstyled",
        "depth": 0, "inlineStyleRanges": [{"offset": 0, "length": 3, "style":
        "TINY"}], "entityRanges": []}]}
      expect_stdout: "<p>Line one<br/>Line two</p><p>Odd</p>"
    assert: *run_snippet

  - description: Upgrade notes across major versions
    vars:
      prompt: >-
        We are pinned to `draftjs_exporter` 5.2.0 and want to move to 7.x. Walk
        me through what breaks along the way — rendered output, dependencies,
        and anything that would make our existing test suite fail.
    assert:
      - type: llm-rubric
        value: >-
          The answer covers all three of these, and is not contradicted by
          anything else it says: (1) v6 changed nested inline style output to
          emit fewer redundant tags, so tests comparing exact HTML break;
          (2) v7 made the Markdown exporter escape user text and link
          destinations, so tests comparing exact Markdown break; (3) v6 dropped
          support for some Python versions (3.7, 3.8 and 3.9) or raised the
          minimum `lxml` version to 4.6.5. Mentioning `string_compat` as a way
          to pin older `string` engine output counts towards (1) only if the
          output change itself is described.

  # --- Gotchas with no code answer, graded by rubric -------------------------

  - description: Reserved entity props
    vars:
      prompt: >-
        I'm writing a custom entity component for `draftjs_exporter` and the
        `entity` key I put in my entity's `data` never reaches my function
        intact — something replaces it. What is happening, which other `data`
        keys behave the same way, and how do I work around it?
    assert:
      - type: llm-rubric
        value: >-
          The answer identifies `entity` as a key the exporter reserves and
          overwrites on the props passed to entity components (it becomes an
          object describing the entity, with its type and mutability), and says
          `children` is reserved the same way. It tells the user to rename their
          data key rather than offering a way to keep using `entity`.

  - description: Engine choice and HTML escaping
    vars:
      prompt: >-
        My `draftjs_exporter` output contains raw HTML from user-entered text
        and it is not being escaped. Which engine should I use, what do I need
        to install, and what should I expect to change in my existing tests?
    assert:
      - type: llm-rubric
        value: >-
          The answer explains that the default `string` engine does not escape
          HTML in text, and recommends switching to the `html5lib` or `lxml`
          engine (installed via the matching package extra) for escaping. It
          warns that engines are not byte-identical — naming at least one real
          difference such as attribute ordering or quote escaping — so tests
          comparing exact HTML will need updating.
