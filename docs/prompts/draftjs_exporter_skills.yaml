  #   vars:
  #     prompt: >-
  #       I'm writing a custom entity decorator in draftjs_exporter and
  #       `props["entity"]` is being overwritten by the framework before my
  #       function sees it. What's happening and how should I work around it?
  #   assert:
  #     - type: skill-used
  #       value: draftjs-exporter
  #     - type: llm-rubric
  #       value: >-
  #         The answer correctly identifies `entity` as a reserved key on the entity `props` dict that the framework replaces internally (`entity` becomes a dict with type/mutability).
  #         The answer encourages picking different data keys.
