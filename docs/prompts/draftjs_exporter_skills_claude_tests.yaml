- description: c17-style-fallback-data
  metadata:
    area: fallbacks
    source: synth-skill
  vars:
    prompt:
      'Using the `draftjs_exporter` Python library, write a complete runnable script
      that renders this ContentState to HTML and prints it. My editor has a color picker that
      produces inline styles named `COLOR_` plus a CSS color name in upper case, and I cannot
      enumerate them. Each one must render as a `<span>` with an inline `color` CSS declaration
      set to the lower-case color name: {"entityMap": {}, "blocks": [{"key": "b0", "text":
      "red and teal", "type": "unstyled", "depth": 0, "inlineStyleRanges": [{"offset": 0,
      "length": 3, "style": "COLOR_RED"}, {"offset": 8, "length": 4, "style": "COLOR_TEAL"}],
      "entityRanges": []}]}'
    expect_contains:
      - <p><span style=
      - "color: red"
      - ">red</span> and <span style="
      - "color: teal"
      - ">teal</span></p>"
    reference: |-
      import json
      import re
      from draftjs_exporter import *
      from draftjs_exporter import HTML, DOM

      content_state = json.loads(r'''{"entityMap": {}, "blocks": [{"key": "b0", "text": "red and teal", "type": "unstyled", "depth": 0, "inlineStyleRanges": [{"offset": 0, "length": 3, "style": "COLOR_RED"}, {"offset": 8, "length": 4, "style": "COLOR_TEAL"}], "entityRanges": []}]}''')

      def color(props):
          name = props["inline_style_range"]["style"].removeprefix("COLOR_").lower()
          return DOM.create_element("span", {"style": {"color": name}}, props["children"])
      print(HTML({"style_map": {**STYLE_MAP, INLINE_STYLES.FALLBACK: color}}).render(content_state))
