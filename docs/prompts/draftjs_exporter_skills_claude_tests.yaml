# Test cases for `draftjs_exporter_skills_claude.yaml`.
#
# Every case asks for a complete, runnable script, graded by running it
# (`graders/run_snippet.py`). `metadata.source` records where the case came
# from: `existing` (also in `draftjs_exporter_skills.yaml`), `issue-N` (adapted
# from that GitHub issue) or `synth-skill` (written from the skill and docs).
#
# `reference` is a known-good answer. It is never sent to the model: the prompt
# template only uses `prompt`. `just eval-claude-check` runs every reference
# through the grader, so a case whose expected output drifts from the library
# fails there instead of silently failing every model.

- description: x01-list-wrapper
  metadata:
    area: html-config
    source: existing
  vars:
    prompt:
      'Using the `draftjs_exporter` Python library, write a complete runnable script
      that renders this ContentState to HTML and prints it, with the unordered list items
      wrapped in `<ul class="bullet-list">`: {"entityMap": {}, "blocks": [{"key": "b0", "text":
      "One", "type": "unordered-list-item", "depth": 0, "inlineStyleRanges": [], "entityRanges":
      []}, {"key": "b1", "text": "Two", "type": "unordered-list-item", "depth": 0, "inlineStyleRanges":
      [], "entityRanges": []}]}'
    expect_stdout: <ul class="bullet-list"><li>One</li><li>Two</li></ul>
    reference: |-
      import json
      import re
      from draftjs_exporter import *
      from draftjs_exporter import HTML, DOM

      content_state = json.loads(r'''{"entityMap": {}, "blocks": [{"key": "b0", "text": "One", "type": "unordered-list-item", "depth": 0, "inlineStyleRanges": [], "entityRanges": []}, {"key": "b1", "text": "Two", "type": "unordered-list-item", "depth": 0, "inlineStyleRanges": [], "entityRanges": []}]}''')

      print(HTML({"block_map": {**BLOCK_MAP, BLOCK_TYPES.UNORDERED_LIST_ITEM: {"element": "li", "wrapper": "ul", "wrapper_props": {"class": "bullet-list"}}}}).render(content_state))
