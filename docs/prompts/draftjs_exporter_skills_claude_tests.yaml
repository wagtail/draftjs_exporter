      "type": "unordered-list-item", "depth": 0, "inlineStyleRanges": [], "entityRanges":
      []}, {"key": "b1", "text": "Bold", "type": "unstyled", "depth": 0, "inlineStyleRanges":
      [{"offset": 0, "length": 4, "style": "BOLD"}], "entityRanges": []}]}'
    expect_contains:
      - "* One"
      - __Bold__
    reference: |-
      import json
      import re
      from draftjs_exporter import *
