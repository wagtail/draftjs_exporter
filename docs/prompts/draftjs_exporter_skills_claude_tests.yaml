      content_state = json.loads(r'''{"entityMap": {}, "blocks": [{"key": "b0", "text": "One", "type": "unordered-list-item", "depth": 0, "inlineStyleRanges": [], "entityRanges": []}, {"key": "b1", "text": "Bold", "type": "unstyled", "depth": 0, "inlineStyleRanges": [{"offset": 0, "length": 4, "style": "BOLD"}], "entityRanges": []}]}''')

      print(HTML(build_markdown_config({"unordered_list_marker": "*", "bold": "__"})).render(content_state))
- description: x03-link-entity
  metadata:
    area: components
    source: existing
  vars:
    prompt:
      'Using the `draftjs_exporter` Python library, write a complete runnable script
      that renders this ContentState to HTML and prints it. LINK entities must render as an
      `<a>` with the entity''s `url` as `href` and a `class="link"` attribute: {"entityMap":
      {"0": {"type": "LINK", "mutability": "MUTABLE", "data": {"url": "https://example.com"}}},
      "blocks": [{"key": "b0", "text": "Hello", "type": "unstyled", "depth": 0, "inlineStyleRanges":
      [], "entityRanges": [{"offset": 0, "length": 5, "key": 0}]}]}'
    expect_contains:
      - "<a "
      - href="https://example.com"
      - class="link"
      - ">Hello</a>"
    reference: |-
      import json
      import re
      from draftjs_exporter import *
      from draftjs_exporter import HTML, DOM

      content_state = json.loads(r'''{"entityMap": {"0": {"type": "LINK", "mutability": "MUTABLE", "data": {"url": "https://example.com"}}}, "blocks": [{"key": "b0", "text": "Hello", "type": "unstyled", "depth": 0, "inlineStyleRanges": [], "entityRanges": [{"offset": 0, "length": 5, "key": 0}]}]}''')

      print(HTML({"entity_decorators": {ENTITY_TYPES.LINK: lambda p: DOM.create_element("a", {"href": p["url"], "class": "link"}, p["children"])}}).render(content_state))
- description: x04-block-fallback
  metadata:
    area: fallbacks
    source: existing
  vars:
    prompt:
      'Using the `draftjs_exporter` Python library, write a complete runnable script
      that renders this ContentState to HTML and prints it. My editor emits custom block types
      I cannot enumerate ahead of time, so I can''t add every one of them to the block map.
      Whenever the exporter meets a block type it has no mapping for, it should keep the block''s
      text and drop the wrapping element rather than fail: {"entityMap": {}, "blocks": [{"key":
      "b0", "text": "Odd", "type": "my-custom-block", "depth": 0, "inlineStyleRanges": [],
      "entityRanges": []}]}'
    expect_stdout: Odd
    reference: |-
      import json
      import re
      from draftjs_exporter import *
      from draftjs_exporter import HTML, DOM

      content_state = json.loads(r'''{"entityMap": {}, "blocks": [{"key": "b0", "text": "Odd", "type": "my-custom-block", "depth": 0, "inlineStyleRanges": [], "entityRanges": []}]}''')

      print(HTML({"block_map": {**BLOCK_MAP, BLOCK_TYPES.FALLBACK: lambda p: p["children"]}}).render(content_state))
- description: x05-import-scheme
  metadata:
    area: markdown-import
    source: existing
  vars:
    prompt:
      Using the `draftjs_exporter` Python library, write a complete runnable script
      that parses the Markdown `See [our page](wagtail://page?id=42).` into Draft.js ContentState,
      turning `wagtail://page` URLs into `LINK` entities whose data holds the page id as an
      integer. Print `json.dumps(content_state["entityMap"], sort_keys=True)`.
    expect_stdout: '{"0": {"data": {"id": 42}, "mutability": "MUTABLE", "type": "LINK"}}'
    reference: |-
      import json
      from draftjs_exporter import MarkdownImporter, scheme_resolver
      content_state = MarkdownImporter({"parser_config": {"link_resolvers": [scheme_resolver("wagtail", {"page": "LINK"}, coerce={"id": int})]}}).import_markdown("See [our page](wagtail://page?id=42).")
      print(json.dumps(content_state["entityMap"], sort_keys=True))
- description: x06-br-style-fallback
  metadata:
    area: fallbacks
    source: existing
  vars:
    prompt:
      'Using the `draftjs_exporter` Python library, write a complete runnable script
      that renders this ContentState to HTML and prints it. Newlines inside block text must
      render as `<br>` elements, and inline styles that are not in the default style map must
      render their text with no surrounding element instead of failing: {"entityMap": {},
      "blocks": [{"key": "b0", "text": "Line one\nLine two", "type": "unstyled", "depth":
      0, "inlineStyleRanges": [], "entityRanges": []}, {"key": "b1", "text": "Odd", "type":
      "unstyled", "depth": 0, "inlineStyleRanges": [{"offset": 0, "length": 3, "style": "TINY"}],
      "entityRanges": []}]}'
    expect_stdout: <p>Line one<br/>Line two</p><p>Odd</p>
    reference: |-
      import json
      import re
      from draftjs_exporter import *
      from draftjs_exporter import HTML, DOM

      content_state = json.loads(r'''{"entityMap": {}, "blocks": [{"key": "b0", "text": "Line one\nLine two", "type": "unstyled", "depth": 0, "inlineStyleRanges": [], "entityRanges": []}, {"key": "b1", "text": "Odd", "type": "unstyled", "depth": 0, "inlineStyleRanges": [{"offset": 0, "length": 3, "style": "TINY"}], "entityRanges": []}]}''')

      print(HTML({"style_map": {**STYLE_MAP, INLINE_STYLES.FALLBACK: lambda p: p["children"]}, "composite_decorators": [{"strategy": re.compile(r"\n"), "component": lambda p: DOM.create_element("br")}]}).render(content_state))
