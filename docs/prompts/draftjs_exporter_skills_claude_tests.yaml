- description: c04-list-depth-class
  metadata:
    area: components
    source: synth-skill
  vars:
    prompt:
      'Using the `draftjs_exporter` Python library, write a complete runnable script
      that renders this ContentState to HTML and prints it. Each `<li>` must carry a class
      naming its nesting depth: `depth-0` for top-level items, `depth-1` for items nested
      once, and so on: {"entityMap": {}, "blocks": [{"key": "b0", "text": "A", "type": "unordered-list-item",
      "depth": 0, "inlineStyleRanges": [], "entityRanges": []}, {"key": "b1", "text": "A1",
      "type": "unordered-list-item", "depth": 1, "inlineStyleRanges": [], "entityRanges":
      []}, {"key": "b2", "text": "B", "type": "unordered-list-item", "depth": 0, "inlineStyleRanges":
      [], "entityRanges": []}]}'
    expect_stdout: <ul><li class="depth-0">A<ul><li class="depth-1">A1</li></ul></li><li class="depth-0">B</li></ul>
    reference: |-
      import json
      import re
      from draftjs_exporter import *
      from draftjs_exporter import HTML, DOM

      content_state = json.loads(r'''{"entityMap": {}, "blocks": [{"key": "b0", "text": "A", "type": "unordered-list-item", "depth": 0, "inlineStyleRanges": [], "entityRanges": []}, {"key": "b1", "text": "A1", "type": "unordered-list-item", "depth": 1, "inlineStyleRanges": [], "entityRanges": []}, {"key": "b2", "text": "B", "type": "unordered-list-item", "depth": 0, "inlineStyleRanges": [], "entityRanges": []}]}''')

      def li(props):
          return DOM.create_element("li", {"class": f"depth-{props['block']['depth']}"}, props["children"])
      print(HTML({"block_map": {**BLOCK_MAP, BLOCK_TYPES.UNORDERED_LIST_ITEM: {"element": li, "wrapper": "ul"}}}).render(content_state))
- description: c05-code-language
  metadata:
    area: components
    source: synth-skill
  vars:
    prompt:
      'Using the `draftjs_exporter` Python library, write a complete runnable script
      that renders this ContentState to HTML and prints it. Code blocks must render as `<pre><code
      class="language-…">`, with the language taken from each block''s `data`: {"entityMap":
      {}, "blocks": [{"key": "b0", "text": "x = 1", "type": "code-block", "depth": 0, "inlineStyleRanges":
      [], "entityRanges": [], "data": {"language": "python"}}]}'
    expect_stdout: <pre><code class="language-python">x = 1</code></pre>
    reference: |-
      import json
      import re
      from draftjs_exporter import *
      from draftjs_exporter import HTML, DOM

      content_state = json.loads(r'''{"entityMap": {}, "blocks": [{"key": "b0", "text": "x = 1", "type": "code-block", "depth": 0, "inlineStyleRanges": [], "entityRanges": [], "data": {"language": "python"}}]}''')

      def code(props):
          lang = props["block"].get("data", {}).get("language", "")
          return DOM.create_element("pre", {}, DOM.create_element("code", {"class": f"language-{lang}"}, props["children"]))
      print(HTML({"block_map": {**BLOCK_MAP, BLOCK_TYPES.CODE: code}}).render(content_state))
