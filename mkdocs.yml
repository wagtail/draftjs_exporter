site_name: draftjs_exporter
repo_url: https://github.com/wagtail/draftjs_exporter
site_url: https://wagtail.github.io/draftjs_exporter/
edit_uri: edit/main/docs/

site_description: Library to convert rich text from Draft.js raw ContentState to HTML.
repo_name: draftjs_exporter
dev_addr: localhost:8001
theme:
  name: material
  font: false
  logo: theme/favicon.png
  favicon: theme/favicon.png
  palette:
    scheme: default
    primary: white
  features:
    - content.code.copy
  custom_dir: docs/theme
markdown_extensions:
  - admonition
  - sane_lists
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      # Only add docs pages that are relevant to users of the project.
      sections:
        Usage documentation:
          - index.md
          - getting-started.md
          - content-state.md
          - markdown.md
          - migration-guide.md
        Guides:
          - guides/custom-components.md
          - guides/fallback-components.md
          - guides/alternative-engines.md
          - guides/custom-engines.md
        Reference:
          - reference/api.md
          - reference/configuration.md
          - reference/example.md
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: false
            heading_level: 4
  - mkdocs-simple-hooks:
      hooks:
        on_post_build: "docs.hooks:on_post_build"
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Content state: content-state.md
  - Markdown support: markdown.md
  - Migration guide: migration-guide.md
  - Guides:
      - Custom components: guides/custom-components.md
      - Fallback components: guides/fallback-components.md
      - Alternative engines: guides/alternative-engines.md
      - Custom engines: guides/custom-engines.md
  - Reference:
      - API: reference/api.md
      - Configuration: reference/configuration.md
      - Example output: reference/example.md
  - Troubleshooting: troubleshooting.md
  - Contributing:
      - Contributing: CONTRIBUTING.md
      - Project architecture: contributing/architecture.md
      - Test strategy: contributing/test-strategy.md
      - Research notes: contributing/research.md
      - Documentation style guide: style-guide.md
  - Security policy: SECURITY.md
  - Roadmap: ROADMAP.md
  - Support: SUPPORT.md
