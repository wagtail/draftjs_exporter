site_name: draftjs_exporter
repo_url: https://github.com/wagtail/draftjs_exporter
site_url: https://wagtail.github.io/draftjs_exporter/
edit_uri: edit/main/docs/

site_description: Library to convert rich text from Draft.js raw ContentState to HTML.
repo_name: draftjs_exporter
dev_addr: localhost:8001
theme:
  name: material
  font: false
  palette:
    primary: indigo
  features:
    - content.code.copy
  custom_dir: docs/overrides
markdown_extensions:
  - admonition
  - sane_lists
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Usage documentation:
          - index.md
          - getting-started.md
          - markdown.md
        Guides:
          - guides/custom-components.md
          - guides/fallback-components.md
          - guides/alternative-engines.md
          - guides/custom-engines.md
        Reference:
          - reference/api.md
          - reference/configuration.md
          - reference/example.md
          - reference/research.md
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: false
            heading_level: 4
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Markdown support: markdown.md
  - Guides:
      - Custom components: guides/custom-components.md
      - Fallback components: guides/fallback-components.md
      - Alternative engines: guides/alternative-engines.md
      - Custom engines: guides/custom-engines.md
  - Reference:
      - API: reference/api.md
      - Configuration: reference/configuration.md
      - Example output: reference/example.md
      - Research notes: reference/research.md
  - Troubleshooting: troubleshooting.md
  - Contributing:
      - Contributing: CONTRIBUTING.md
      - Project architecture: contributing/architecture.md
      - Test strategy: contributing/test-strategy.md
  - Security policy: SECURITY.md
  - Roadmap: ROADMAP.md
  - Support: SUPPORT.md
