name: CI
permissions:
  contents: read
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
      - "renovate/**"
  pull_request:
jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: uv sync --dev
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check
      - run: uv run mypy draftjs_exporter tests
      - run: uv run ty check --output-format=github .
      - run: uv run just benchmark
      - run: just build
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
      - run: npm ci
      - run: npm run lint
      - run: uv run just test-coverage
  test_compatibility:
    needs: test
    runs-on: ubuntu-slim
    strategy:
      matrix:
        python-version:
          # Skip oldest supported version, checked in the "test_lower_bound" job.
          # - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          # Skip latest version, tested in the main "test" job.
          # - "3.14"
          # Skip future version, tested in the "test_experimental" job.
          # - "3.15"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: uv sync --dev
      - run: uv run just test
  test_lower_bound:
    needs: test
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: just test-compatibility
  test_experimental:
    # Ad-hoc job to test experimental support without having to adjust all of our project for compatibility.
    needs: test
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # See available versions:
          # https://github.com/actions/python-versions/tags
          python-version: "3.15-dev"
      - uses: astral-sh/setup-uv@v7
      - run: uv run --no-group dev --with 'beautifulsoup4>=4.4.1,<5, html5lib==1.1' python -X dev example.py
