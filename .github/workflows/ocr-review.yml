# OpenCodeReview - GitHub Actions PR Auto-Review Demo
#
# Demonstrates invoking the reusable action for both automatic PR review (pull_request_target: opened/synchronize/reopened) and on-demand re-review via comments starting with '/open-code-review' or '@open-code-review'.
#
# Required secrets/vars (Settings -> Secrets and variables -> Actions):
#   secret    OCR_LLM_URL            LLM API endpoint
#   secret    OCR_LLM_AUTH_TOKEN     LLM auth token (mapped to OCR_LLM_TOKEN)
#
# The review rules live in .opencodereview: README.md for the integration, rule.json for the rules file mapping, python.md for the guidelines. Follow the documentation style guide in docs/style-guide.md when editing this file or those.
#
# For the full list of action inputs/outputs and the four comment-posting modes (sticky / incremental), see action.yml at the repo root.

name: OpenCodeReview PR Review

# Conditional concurrency group.
#
# Actions evaluates concurrency BEFORE job-level if-conditions. So a flat group (ocr-<pr_number>) puts every comment on the PR, including replies the job will skip, into one group; with cancel-in-progress on, one normal comment kills a running review and you see "two runs, one cancelled" in the Actions tab.
#
# Fix: matching events (PR events and /open-code-review comments) share a per-PR group so a new review cancels a stale one for the same PR. Non-matching comments land in a unique noop-<run_id> group that cannot collide with a real review, so they are skipped without disrupting anything.
concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

# ⚠️ pull_request_target, so secrets reach PRs from forks. That trust is safe only while this workflow never executes PR code: no step checks out or runs it, no PR value reaches a shell, and rules come from main. Break any of those and this becomes a pwn request vector. See the GitHub guide on securely using pull_request_target: https://docs.github.com/en/actions/reference/security/securely-using-pull_request_target
on: # zizmor: ignore[dangerous-triggers] -- never runs untrusted code, only reads it.
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# Least privilege for a privileged event: contents: read covers the diff, pull-requests: write covers posting. No write token or cache is exposed to PR code, because none runs here.
permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    # Run on PR events, or on human comments starting with a trigger keyword. The bot-author check is a safety net: GITHUB_TOKEN already suppresses bot-posted comment events, a PAT or App token would not. Renovate PRs are excluded here rather than via branches-ignore on the trigger, because pull_request_target branch filters match the PR's base branch (renovate PRs always target main) and so can never exclude the renovate/* head branch.
    if: |
      (
        github.event_name == 'pull_request_target'
        && !startsWith(github.head_ref, 'renovate/')
      )
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      # pull_request_target already carries the refs in its payload, but an issue_comment payload has none, so this fills head_sha and title from the API instead. head_sha only names a git object to diff and title only reaches the prompt as background, so neither reaches a shell. The title is fork-controlled, so treat it as review-quality input, not trusted input.
      - name: Resolve PR context
        id: pr-context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              const prNumber = context.issue.number;
              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              core.setOutput('head_sha', pullRequest.head.sha);
              core.setOutput('title', pullRequest.title);
            }

      # Always read the rules from main, whatever the PR changes in .opencodereview, or a PR could edit them to steer its own review or switch off the checks that flag it.
      #
      # Fetched over the checkout's own .opencodereview/ rather than to a directory of our own, because OCR resolves a rule entry's file value against different bases depending on how rule.json is reached: the repo root for the project layer at <repoDir>/.opencodereview/rule.json, but rule.json's own directory when the file is passed through the action's rule input. Overwriting in place keeps one base in play, so the ".opencodereview/python.md" value in the committed file stays correct, and the read stays inside the repo so OCR's own traversal confinement still applies.
      #
      # The action checks out the base branch (main), not the PR head, so this overwrite replaces main's rules with main's rules; it only ever discards a PR's tampered copy.
      #
      # curl rather than trusting the checkout alone so the rules are pinned to main by URL, and a failure fails the job rather than silently falling back to whatever the workspace holds.
      - name: Fetch trusted rules from base branch
        shell: bash
        run: |
          # Pinned to main, never the PR branch: the URL is what makes the rules trustworthy, not the host.
          REPO="${{ github.repository }}"
          RULES_DIR="${{ github.workspace }}/.opencodereview"
          mkdir -p "$RULES_DIR"
          for file in rule.json python.md README.md; do
            curl -sSfL -o "$RULES_DIR/$file" \
              "https://raw.githubusercontent.com/${REPO}/main/.opencodereview/${file}"
          done

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@8eb83340a487b1150af00701b94f01af97e4b4d6 # v1.13.1
        with:
          # Passed as inputs, never interpolated into a shell, so the values cannot be read as commands.
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: MiniMax-M3
          llm_use_anthropic: false
          # No rule input: the rules fetched above land at <repoDir>/.opencodereview/, which OCR loads as the project layer by itself. Passing rule.json through the rule input would resolve its "rule" value against the rule file's directory instead, a different base that silently drops the guidelines.
          # Hard-coded, matching the rules fetch above: a PR opened against another branch must not pick its own base.
          base_ref: main
          # Set only for issue_comment, by the step above; under pull_request_target the action reads it from the event, so empty is deliberate.
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
          # Particularly useful when PR titles follow semantic conventions (e.g., feat(auth): add OAuth2 support).
          background: ${{ steps.pr-context.outputs.title || github.event.pull_request.title }}
