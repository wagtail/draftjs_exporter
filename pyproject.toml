[project]
name = "draftjs_exporter"
version = "7.1.0"
description = "Library to convert rich text from Draft.js raw ContentState to HTML"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Development Status :: 5 - Production/Stable",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Editors :: Word Processors",
  "Typing :: Typed",
]

[project.urls]
Documentation = "https://wagtail.github.io/draftjs_exporter/"
Source = "https://github.com/wagtail/draftjs_exporter"
Tracker = "https://github.com/wagtail/draftjs_exporter/issues"
Changelog = "https://github.com/wagtail/draftjs_exporter/blob/main/CHANGELOG.md"
"llms.txt" = "https://wagtail.github.io/draftjs_exporter/llms.txt"

[project.optional-dependencies]
# Lower version bound for lxml - choose a version with:
# - lxml>=4.4.0 attribute sorting
# - Pre-built wheels on the lowest-supported Python version.
# - The last patch release of a given minor version to benefit from bug fixes.
# Check pre-built wheels: https://pypi.org/project/lxml/4.6.5/#files
# Upper version bound for lxml: avoid breaking changes without testing to confirm
# there are no output changes in the new version.
lxml = ["lxml>=4.6.5,<7"]
html5lib = ["beautifulsoup4>=4.4.1,<5", "html5lib>=0.999,<2"]

[dependency-groups]
dev = [
  "hypothesis>=6.100.0",
  "import-linter>=2.0",
  "mypy==2.3.1",
  "pyrefly>=1.3.0,<2",
  "pyright>=1.1.414,<2",
  "pytest>=7.4.3",
  "pytest-cov>=4.1.0",
  "pytest-xdist>=3.5.0",
  "pytest-memray>=1.7.0",
  "ruff>=0.1.9",
  "ty>=0.0.25",
  # Benchmark dependencies.
  "markov_draftjs>=2.0.0",
  "memray>=1.15.0",
  "psutil>=5.9.7",
  # HTML builders.
  "lxml>=4.6.5,<7",
  "types-lxml>=2026.2.16",
  "beautifulsoup4>=4.4.1,<5",
  "types-beautifulsoup4>=4.12.0",
  "html5lib>=0.999,<2",
  # Documentation.
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.27.0",
  "mkdocs-llmstxt>=0.5.0",
  "mkdocs-simple-hooks>=0.1.5",
  "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "draftjs_exporter"
module-root = ""

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# E: pycodestyle errors
# F: Pyflakes
# I: isort
# S: flake8-bandit
# T20: flake8-print
# BLE: flake8-blind-except
# C4: flake8-comprehensions
# B006: Do not use mutable data structures for argument defaults
# B904: Within an `except` clause, raise exceptions with `raise ... from err`
select = ["E", "F", "I", "S", "T20", "BLE", "C4", "B006", "B904", "D"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101", # Assert allowed in tests
  "S105", # Hardcoded password assignments allowed in tests
  "S106", # Hardcoded password assignments allowed in tests
  "S301", # Use of pickle allowed in tests
  "S308", # Mark safe is often necessary in tests
  "S324", # Any hashlib usage is allowed in tests, no need to use a secure hash functions only
  "D",    # Docstrings are not required in tests
]
"test_*" = [
  "S101", # Assert allowed in tests
  "S105", # Hardcoded password assignments allowed in tests
  "S106", # Hardcoded password assignments allowed in tests
  "S301", # Use of pickle allowed in tests
  "S308", # Mark safe is often necessary in tests
  "S324", # Any hashlib usage is allowed in tests, no need to use a secure hash functions only
  "D",    # Docstrings are not required in tests
]

[tool.importlinter]
root_packages = ["draftjs_exporter", "tests"]

[[tool.importlinter.contracts]]
name = "Importer modules do not import exporter modules"
type = "forbidden"
source_modules = [
    "draftjs_exporter.contentstate_filter",
    "draftjs_exporter.markdown_importer",
    "draftjs_exporter.markdown_parser",
]
forbidden_modules = [
    "draftjs_exporter.composite_decorators",
    "draftjs_exporter.defaults",
    "draftjs_exporter.dom",
    "draftjs_exporter.entity_state",
    "draftjs_exporter.html",
    "draftjs_exporter.markdown",
    "draftjs_exporter.options",
    "draftjs_exporter.style_state",
    "draftjs_exporter.wrapper_state",
]

[[tool.importlinter.contracts]]
# Full-output integration tests should consume the library through its public
# root API (`from draftjs_exporter import ...`) rather than reaching into
# internal modules. `draftjs_exporter.*` matches child modules only, so the
# root package itself remains importable. `allow_indirect_imports` is required
# because the public root API itself transitively uses those internal modules;
# only *direct* imports of internal modules are forbidden. Note: import-linter
# only analyzes packages, so loose top-level scripts (example.py, benchmark.py)
# can't be tracked here; they follow the same "root imports only" convention
# by hand.
name = "Full-output integration tests use only the public root API"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "tests.test_output",
    "tests.test_exports",
    "tests.test_imports",
    "tests.test_properties",
]
forbidden_modules = ["draftjs_exporter.*"]

[tool.mypy]
python_version = "3.10"
# Skip gitignored directories (site/, .venv/, ...) when discovering files to check.
exclude_gitignore = true
# https://mypy.readthedocs.io/en/latest/config_file.html
#### Additional opt-in checks of mypy.
# Disallows usage of types that come from unfollowed imports (anything imported from an unfollowed import is automatically given a type of Any).
disallow_any_unimported = true
# Disallows all expressions in the module that have type Any.
disallow_any_expr = false
# Disallows functions that have Any in their signature after decorator transformation.
disallow_any_decorated = false
# Disallows explicit Any in type positions such as type annotations and generic type parameters.
disallow_any_explicit = false
# Disallows usage of generic types that do not specify explicit type parameters.
disallow_any_generics = true
# Disallows subclassing a value of type Any.
disallow_subclassing_any = true

# Disallows calling functions without type annotations from functions with type annotations.
disallow_untyped_calls = true
# Disallows defining functions without type annotations or with incomplete type annotations.
disallow_untyped_defs = true
# Disallows defining functions with incomplete type annotations.
disallow_incomplete_defs = true
# Type-checks the interior of functions without type annotations.
check_untyped_defs = true
# Reports an error whenever a function with type annotations is decorated with a decorator without annotations.
disallow_untyped_decorators = true


# Warns about casting an expression to its inferred type.
# ty requires more casts than mypy currently.
warn_redundant_casts = false
warn_unused_ignores = true
# Shows errors for missing return statements on some execution paths.
warn_no_return = true
# Shows a warning when returning a value with type Any from a function declared with a non- Any return type.
warn_return_any = true
# Shows a warning when encountering any code inferred to be unreachable or redundant after performing type analysis.
warn_unreachable = true


# Prohibit equality checks, identity checks, and container checks between non-overlapping types.
strict_equality = true
# Extend the above to checks involving None.
strict_equality_for_none = true
# Enable additional checks that are technically correct but may be impractical in real code.
extra_checks = true
# Prevent automatic re-export of names imported from other modules to avoid accidental API exposure.
no_implicit_reexport = true
# Warn about unused '[mypy-<pattern>]' or '[[tool.mypy.overrides]]' config sections.
warn_unused_configs = true

# Additional opt-in error codes.
enable_error_code = [
  # Flag "type: ignore" comments without an error code.
  "ignore-without-code",
  # Flag methods overriding a parent method without the @override decorator.
  # TODO Enable once we depend on typing_extensions for Python 3.10 support.
  # "explicit-override",
  # Flag use of a deprecated feature.
  "deprecated",
  # Flag use of variables that may be undefined in some code paths.
  "possibly-undefined",
  # Flag boolean checks on types that are always truthy or always falsy.
  "truthy-bool",
  # Flag conditions and expressions that are always true or always false.
  "redundant-expr",
  # Flag redundant annotations of the self or cls parameter.
  "redundant-self",
  # Flag overrides of a mutable attribute with an immutable type, or vice versa.
  "mutable-override",
  # Flag use of typing.reveal_type without importing it.
  "unimported-reveal",
]

[[tool.mypy.overrides]]
module = "tests.*"
# For test cases, we don’t need to annotate functions.
disallow_untyped_defs = false
# disallow_incomplete_defs = false
# warn_no_return = false

[tool.ty.rules]
# Opt-in soundness checks, disabled by default in ty.
# See https://docs.astral.sh/ty/reference/rules/.
# Casting to a type with no possible overlap is likely a mistake.
disjoint-cast = "error"
# Flag assignments, returns, and yields of `Any` values where a precise type is declared.
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"

[tool.pyright]
# https://microsoft.github.io/pyright/#/configuration
pythonVersion = "3.10"
# "standard" adds cross-module checks mypy lacks, like TypedDict required-key access.
typeCheckingMode = "standard"
# Generated output of the docs build, also gitignored. Unlike ty and pyrefly,
# pyright does not respect .gitignore on its own.
exclude = ["site"]
executionEnvironments = [
  # Test code may access optional Draft.js keys directly, like anywhere else in tests.
  { root = "tests", reportTypedDictNotRequiredAccess = "none" },
]

[tool.pyrefly]
# https://pyrefly.org/en/docs/configuration/
python-version = "3.10"
# Flag reassignment of ALL_CAPS constants.
treat-all-caps-as-final = true

[tool.pyrefly.errors]
# Enforce annotations on production code, like `disallow_untyped_defs` in mypy.
implicit-any = true
unannotated-return = true
# Flag TypedDict key accesses that may raise a KeyError, like pyright does.
not-required-key-access = true
# Additional checks, all currently passing.
# Flag stale "# pyrefly: ignore" comments.
unused-ignore = true
# Flag instantiation of abstract classes with unimplemented methods.
direct-abstract-base-instantiation = true

[[tool.pyrefly.sub-config]]
# Test code is exempt from the annotation requirements of production code,
# but is still checked, like with the mypy overrides above.
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false
unannotated-return = false
not-required-key-access = false
